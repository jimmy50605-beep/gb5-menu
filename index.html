<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style id="gb5-style">
/* Layout: one cream "paper" column like the printed menu; three sections (手沖咖啡 / 飲品 / 甜點) with numbered items and sticky tabs; each bean row = 編號 | 品名+風味 | 處理法 | 售價 on wide screens, stacked on phones. Single light theme on purpose: it is the shop's paper menu. */
:root{
  --paper:#ECE4D3;
  --paper-deep:#E3D8C3;
  --card:#F4EEE2;
  --field:#FFFCF6;
  --ink:#24170D;
  --ink-soft:#5E4938;
  --roast:#603518;
  --latte:#BFAC97;
  --latte-soft:#D2C3AE;
  --ribbon:#A8231C;
  --gold:#F1CD78;
  --f-script:"Ms Madi","Snell Roundhand","Brush Script MT",cursive;
  --f-head:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --f-note:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-num:"Playfair Display",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-head);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
body.has-fab{padding-bottom:84px}
body.has-bar{padding-bottom:130px}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--roast);outline-offset:2px}

/* masthead */
.masthead{padding-block:26px 6px}
.brush{position:relative;isolation:isolate;margin:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;column-gap:12px;padding:20px 22px 22px;font-weight:900}
.brush-bg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible}
.bean-img{width:70px;height:auto;transform:rotate(-6deg)}
.logo{font-family:var(--f-script);font-weight:400;font-size:58px;line-height:1;padding-top:8px;letter-spacing:.01em}
.menu-title{flex-basis:100%;text-align:center;font-size:22px;letter-spacing:.06em;line-height:1.3;margin-top:2px}
.menu-title .bar{font-weight:500;margin:0 .3em;color:var(--ink-soft)}
.updated{margin:12px 0 0;text-align:center;font-size:13px;color:var(--ink-soft);letter-spacing:.06em}
.updated time{font-family:var(--f-num);font-weight:700;font-size:14px;color:var(--ink);font-variant-numeric:lining-nums;margin-left:4px}
@media (min-width:640px){
  .menu-title{flex-basis:auto;margin:0 0 0 14px;font-size:26px}
  .bean-img{width:84px}
  .logo{font-size:66px}
}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--latte-soft);margin-top:14px}
.tabs-inner{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px}
.tabs-inner::-webkit-scrollbar{display:none}
.tab{flex:none;font:700 15px/1 var(--f-head);color:var(--ink-soft);background:transparent;border:1.5px solid var(--latte);border-radius:999px;padding:9px 15px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.tab[aria-current="true"]{background:var(--roast);border-color:var(--roast);color:var(--paper)}

/* regions */
.region{padding-block:30px 4px;scroll-margin-top:calc(62px + env(safe-area-inset-top,0px))}
.region-head{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.region-head::after{content:"";flex:1;height:1px;background:var(--latte)}
.pill{margin:0;background:var(--roast);color:var(--paper);font-weight:900;font-size:21px;letter-spacing:.1em;line-height:1.2;padding:7px 16px 8px;border-radius:12px}
.count{font-size:13px;font-weight:700;color:var(--ink-soft);order:3}
.cols{display:none}
.beans{list-style:none;margin:0;padding:0}
.bean{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;grid-template-areas:". badge badge" "no name price" ". notes notes" ". proc proc";column-gap:10px;padding:15px 0 16px;border-bottom:1px dashed var(--latte)}
.bean:last-child{border-bottom:0}
.no{font-family:var(--f-num);font-weight:900;font-size:18px;line-height:1.3;color:var(--roast);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.bean .no{grid-area:no}
.bean .no,.bean .bean-name,.bean .price{align-self:baseline}
.badge{grid-area:badge;justify-self:start;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:900;letter-spacing:.14em;color:var(--gold);background:var(--ribbon);padding:3px 14px 3px 8px;margin-bottom:7px;clip-path:polygon(0 0,100% 0,calc(100% - 7px) 50%,100% 100%,0 100%)}
.badge svg{width:11px;height:11px;fill:currentColor}
.bean-name{grid-area:name;margin:0;font-size:17px;font-weight:900;line-height:1.4;min-width:0;word-break:keep-all;overflow-wrap:anywhere}
.price{grid-area:price;align-self:start;font-family:var(--f-num);font-weight:900;font-size:22px;line-height:1.15;white-space:nowrap;font-variant-numeric:lining-nums tabular-nums}
.price small{font-family:var(--f-head);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink-soft);margin-right:3px}
.notes{grid-area:notes;margin:6px 0 0;font-family:var(--f-note);font-size:14.5px;line-height:1.75;color:var(--ink-soft);min-width:0}
.notes span{white-space:nowrap}
.notes span:not(:first-child)::before{content:"・";color:var(--latte);margin:0 .1em}
.proc{grid-area:proc;justify-self:start;margin-top:9px;font-size:12.5px;font-weight:700;color:var(--roast);background:var(--paper-deep);border:1px solid var(--latte-soft);border-radius:4px;padding:2px 8px}
@media (min-width:700px){
  .cols{display:grid;grid-template-columns:2.2rem minmax(0,1fr) 12rem 5.5rem;column-gap:10px;padding:12px 0 7px;border-bottom:2px solid var(--ink);font-size:14px;font-weight:900;color:var(--ink-soft);letter-spacing:.04em}
  .cols span:nth-child(3){text-align:center}
  .cols span:last-child{text-align:right}
  .bean{grid-template-columns:2.2rem minmax(0,1fr) 12rem 5.5rem;grid-template-areas:". badge badge badge" "no name proc price" ". notes proc price";column-gap:10px}
  .proc{align-self:center;justify-self:center;text-align:center;margin:0;background:none;border:0;padding:0;font-size:14.5px;color:var(--ink)}
  .bean .price{align-self:center;justify-self:end}
}

/* drinks */
.drinks{margin-top:6px}
.d-row{display:grid;grid-template-columns:2.2rem minmax(0,max-content) minmax(12px,1fr) 3.3rem 3.3rem;align-items:baseline;column-gap:10px;padding:11px 0}
.d-head{padding:10px 0 2px;border-bottom:2px solid var(--ink)}
.d-head span{font-family:var(--f-num);font-weight:900;font-size:13px;letter-spacing:.16em;color:var(--ink-soft)}
.d-head .d-p{font-size:13px}
.d-row .no{font-size:16px}
@media (max-width:520px){.d-name i{display:block;margin-left:0;font-size:13px;line-height:1.3}}
.d-name b{font-weight:900;font-size:16.5px}
.d-name i{font-style:normal;font-family:var(--f-num);font-weight:700;font-size:14px;color:var(--ink-soft);margin-left:6px}
.d-lead{border-bottom:2px dotted var(--latte);transform:translateY(-5px)}
.d-head .d-lead{border:0}
.d-p{text-align:right;font-family:var(--f-num);font-weight:900;font-size:19px;font-variant-numeric:lining-nums tabular-nums}
.d-p.na{color:var(--latte);font-weight:400}

/* desserts */
.desserts{list-style:none;margin:6px 0 0;padding:0}
.dessert{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:16px;align-items:center;padding:16px 0;border-bottom:1px dashed var(--latte)}
.dessert:last-child{border-bottom:0}
.dessert.noimg{grid-template-columns:minmax(0,1fr)}
.d-text{display:grid;grid-template-columns:2.2rem minmax(0,1fr);column-gap:10px;align-items:baseline;min-width:0}
.dessert h3{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:12px;font-size:18px;font-weight:900}
.dessert h3 .price{font-size:20px}
.dessert p{margin:6px 0 0;font-family:var(--f-note);font-size:14px;line-height:1.75;color:var(--ink-soft)}
.dessert img{width:92px;height:92px;max-width:100%;object-fit:cover;border-radius:30px;background:var(--paper-deep)}
@media (min-width:700px){.dessert{grid-template-columns:minmax(0,1fr) 132px}.dessert img{width:132px;height:132px;border-radius:36px}}

/* footer */
.foot{margin-top:44px;border-top:2px solid var(--ink);overflow:hidden}
.foot-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding-block:18px 10px}
.ig{color:var(--ink);text-decoration:none;font-size:13px;font-weight:700;letter-spacing:.04em}
.ig b{font-family:var(--f-num);font-size:16px;margin-left:4px;border-bottom:1.5px solid var(--latte)}
.wifi{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.wifi svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.wifi code{font-family:var(--f-num);font-weight:900;font-size:17px;letter-spacing:.06em;user-select:all}
.copy{font:700 13px/1 var(--f-head);color:var(--ink);background:transparent;border:1.5px solid var(--latte);border-radius:999px;padding:7px 12px;cursor:pointer}
.watermark{font-family:var(--f-num);font-weight:900;font-size:min(19vw,160px);line-height:.8;color:var(--latte-soft);text-align:center;white-space:nowrap;margin-top:6px;margin-bottom:-.13em;user-select:none}

/* edit button for the owner */
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:13px 18px;font:700 15px/1 var(--f-head);box-shadow:0 6px 18px rgba(36,23,13,.28);cursor:pointer}
.fab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}

/* edit mode */
.ed{padding-block:22px 190px}
.ed h2{margin:30px 0 10px;font-size:20px;font-weight:900;color:var(--roast);display:flex;align-items:center;gap:10px}
.ed h2::after{content:"";flex:1;height:1px;background:var(--latte)}
.ed-title{margin:0;font-size:24px;font-weight:900}
.ed-help{margin:6px 0 0;color:var(--ink-soft);font-size:14px;line-height:1.6;max-width:60ch}
.ed-note{margin:0 0 10px;color:var(--ink-soft);font-size:13px}
.ed-grid{display:grid;gap:10px}
@media (min-width:640px){.ed-grid{grid-template-columns:1fr 1fr}}
.fld{display:grid;gap:4px;min-width:0}
.field-label{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em}
.ed input[type=text],.ed textarea,.ed select{width:100%;min-width:0;font:500 16px/1.4 var(--f-head);color:var(--ink);background:var(--field);border:1.5px solid var(--latte);border-radius:8px;padding:9px 11px}
.ed textarea{resize:vertical}
.ed select{padding-right:28px}
.ed input:focus,.ed textarea:focus,.ed select:focus{outline:2px solid var(--roast);outline-offset:0;border-color:var(--roast)}
.with-btn{display:flex;gap:8px;align-items:end}
.with-btn .fld{flex:1}
.ed-region{margin-top:18px;padding:14px;border:1.5px solid var(--latte);border-radius:14px;background:var(--paper-deep)}
.ed-region-head{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.ed-region-head .fld{flex:1 1 180px}
.ed-list{list-style:none;margin:12px 0;padding:0;display:grid;gap:10px}
.ed-item{display:grid;gap:9px;padding:12px;border:1px solid var(--latte-soft);border-radius:10px;background:var(--card)}
.ed-item.is-pick{border-color:var(--ribbon)}
.ed-no{font-family:var(--f-num);font-weight:900;font-size:20px;line-height:1;color:var(--roast)}
.ed-line{display:grid;grid-template-columns:minmax(0,1fr) 6.5rem;gap:8px}
.ed-line.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.ed-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ed-tools .spacer{flex:1}
.chk{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;cursor:pointer;padding:6px 0}
.chk input{width:20px;height:20px;accent-color:var(--ribbon)}
.move{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-soft)}
.move select{width:auto;max-width:9.5rem;padding:7px 26px 7px 9px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;font:700 14px/1 var(--f-head);color:var(--ink);background:transparent;border:1.5px solid var(--latte);border-radius:8px;padding:9px 12px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:default}
.btn.icon{width:40px;padding:0}
.btn.icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.danger{color:var(--ribbon);border-color:var(--ribbon)}
.btn.armed{background:var(--ribbon);color:#fff;border-color:var(--ribbon)}
.btn.add{width:100%;border-style:dashed;border-color:var(--ink-soft);color:var(--ink-soft);background:transparent}
.ed-photo{display:flex;align-items:center;gap:12px}
.ed-photo img,.ph-empty{width:84px;height:84px;flex:none;border-radius:22px;object-fit:cover;background:var(--paper-deep)}
.ph-empty{display:grid;place-items:center;font-size:12px;color:var(--ink-soft);border:1.5px dashed var(--latte)}
.ed-photo-btns{display:flex;flex-wrap:wrap;gap:8px}
.ed-bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--ink);color:var(--paper);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -6px 18px rgba(36,23,13,.2)}
.ed-bar-inner{max-width:780px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ed-status{flex:1 1 100%;margin:0;font-size:13px;line-height:1.45;color:var(--latte-soft);min-height:1.45em}
.ed-status.err{color:var(--gold)}
.ed-bar .btn{color:var(--paper);border-color:rgba(236,228,211,.4)}
.ed-bar .btn.pub{margin-left:auto;background:var(--gold);border-color:var(--gold);color:var(--ink);padding-inline:16px}
.ed-bar .btn.armed{background:var(--ribbon);border-color:var(--ribbon);color:#fff}
.preview-flag{position:sticky;top:env(safe-area-inset-top,0px);z-index:21;background:var(--gold);color:var(--ink);text-align:center;font-size:13px;font-weight:700;padding:7px 16px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<script id="gb5-script">
(function(){
'use strict';
var PAGE_HEAD='<title>GB5 LAB 豆單</title>\n\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ms+Madi&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@400;600&family=Playfair+Display:wght@700;900&display=swap">';
var FALLBACK_RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
var app=document.getElementById('app');
var saved;
try{saved=JSON.parse(document.getElementById('gb5-data').textContent);}catch(e){saved={};}
saved=normalize(saved);
var state=clone(saved);
var mode='view';            // view | edit | preview
var canEdit=false, artifactNS=null, busy=false, stampToday=true;
var undo=[], lastCommitted='', photoTarget=null, spyObserver=null, statusMsg='', statusErr=false;
var DRAFT_KEY='gb5-menu-draft';

function clone(o){return JSON.parse(JSON.stringify(o));}
function normalize(d){
  d=d||{};
  d.title=d.title||'手冲豆單 | MENU';
  d.date=d.date||'';
  d.instagram=d.instagram||'';
  d.wifi=d.wifi||'';
  if(!Array.isArray(d.coffee)){
    d.coffee=[];
    (Array.isArray(d.regions)?d.regions:[]).forEach(function(r){(r&&Array.isArray(r.beans)?r.beans:[]).forEach(function(b){d.coffee.push(b);});});
  }
  delete d.regions;
  d.drinks=Array.isArray(d.drinks)?d.drinks:[];
  d.desserts=Array.isArray(d.desserts)?d.desserts:[];
  return d;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function img(src){src=String(src||'');return /^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(src)?src:'';}
function igHandle(s){return String(s||'').replace(/^@/,'').replace(/[^A-Za-z0-9._]/g,'');}
function pad(n){return (n<10?'0':'')+n;}
function today(){var d=new Date();return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate());}
function hasPrice(n){return n!==null&&n!==undefined&&n!=='';}

var ICON={
  star:'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 .7l1.6 3.3 3.6.5-2.6 2.5.6 3.6L6 8.9l-3.2 1.7.6-3.6L.8 4.5l3.6-.5z"/></svg>',
  wifi:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9a14 14 0 0 1 19 0M5.8 12.6a9 9 0 0 1 12.4 0M9.1 16.1a4.3 4.3 0 0 1 5.8 0"/><circle cx="12" cy="19.4" r=".9" fill="currentColor"/></svg>',
  pen:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  up:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
  del:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>'
};

/* ---------- customer view ---------- */
function notesHtml(s){
  var parts=String(s||'').split(/[\\＼、]/).map(function(t){return t.trim();}).filter(Boolean);
  return parts.length?'<p class="notes">'+parts.map(function(t){return '<span>'+esc(t)+'</span>';}).join('<wbr>')+'</p>':'';
}
function priceHtml(n){return hasPrice(n)?'<span class="price"><small>NT.</small>'+esc(n)+'</span>':'';}
function noHtml(i){return '<span class="no">'+(i+1)+'.</span>';}
function viewBean(b,i){
  return '<li class="bean">'+(b.pick?'<span class="badge">'+ICON.star+'店長推薦</span>':'')+noHtml(i)+
    '<h3 class="bean-name">'+esc(b.name)+'</h3>'+priceHtml(b.price)+notesHtml(b.flavor)+
    (b.process?'<span class="proc"><span class="sr">處理法：</span>'+esc(b.process)+'</span>':'')+'</li>';
}
function viewCoffee(d){
  if(!d.coffee.length)return '';
  return '<section class="region" id="coffee" aria-labelledby="coffee-h"><div class="region-head"><h2 class="pill" id="coffee-h">手沖咖啡</h2></div>'+
    '<div class="cols" aria-hidden="true"><span></span><span>國家產地｜風味描述</span><span>處理法</span><span>售價</span></div>'+
    '<ol class="beans">'+d.coffee.map(viewBean).join('')+'</ol></section>';
}
function viewDrinks(d){
  if(!d.drinks.length)return '';
  var rows=d.drinks.map(function(x,i){
    return '<div class="d-row" role="row"><span class="no" role="cell">'+(i+1)+'.</span><span class="d-name" role="rowheader"><b>'+esc(x.name)+'</b>'+(x.en?'<i>'+esc(x.en)+'</i>':'')+'</span><span class="d-lead" aria-hidden="true"></span>'+
      '<span class="d-p'+(hasPrice(x.hot)?'':' na')+'" role="cell">'+(hasPrice(x.hot)?esc(x.hot):'<span aria-label="不供應">—</span>')+'</span>'+
      '<span class="d-p'+(hasPrice(x.iced)?'':' na')+'" role="cell">'+(hasPrice(x.iced)?esc(x.iced):'<span aria-label="不供應">—</span>')+'</span></div>';
  }).join('');
  return '<section class="region" id="drinks" aria-labelledby="drinks-h"><div class="region-head"><h2 class="pill" id="drinks-h">飲品</h2></div>'+
    '<div class="drinks" role="table" aria-label="飲品價目"><div class="d-row d-head" role="row"><span role="columnheader"><span class="sr">編號</span></span><span role="columnheader" class="d-name"><span class="sr">品項</span></span><span class="d-lead" aria-hidden="true"></span><span class="d-p" role="columnheader">HOT</span><span class="d-p" role="columnheader">ICED</span></div>'+rows+'</div></section>';
}
function viewDesserts(d){
  if(!d.desserts.length)return '';
  var items=d.desserts.map(function(x,i){
    var src=img(x.photo);
    var lines=(x.desc||[]).filter(function(l){return String(l).trim();});
    return '<li class="dessert'+(src?'':' noimg')+'"><div class="d-text">'+noHtml(i)+'<div><h3><span>'+esc(x.name)+'</span>'+priceHtml(x.price)+'</h3>'+
      (lines.length?'<p>'+lines.map(esc).join('<br>')+'</p>':'')+'</div></div>'+(src?'<img src="'+src+'" alt="'+esc(x.name)+'" width="132" height="132">':'')+'</li>';
  }).join('');
  return '<section class="region" id="desserts" aria-labelledby="desserts-h"><div class="region-head"><h2 class="pill" id="desserts-h">甜點</h2></div><ul class="desserts">'+items+'</ul></section>';
}
function titleHtml(t){return esc(t).replace(/\s*\|\s*/,'<span class="bar">|</span>');}
function renderView(d){
  var tabs=[];
  if(d.coffee.length)tabs.push(['coffee','手沖咖啡']);
  if(d.drinks.length)tabs.push(['drinks','飲品']);
  if(d.desserts.length)tabs.push(['desserts','甜點']);
  var bean=img(d.logoImg);
  var ig=igHandle(d.instagram);
  var h='';
  if(mode==='preview')h+='<div class="preview-flag">預覽中：客人看到的樣子（還沒發布）</div>';
  h+='<header class="masthead wrap"><h1 class="brush">'+
    '<svg class="brush-bg" viewBox="0 0 600 150" preserveAspectRatio="none" aria-hidden="true"><defs><filter id="rough" x="-5%" y="-30%" width="110%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.011 0.3" numOctaves="3" seed="11"/><feDisplacementMap in="SourceGraphic" scale="20" xChannelSelector="R" yChannelSelector="G"/></filter></defs><path d="M20 24 L588 12 L582 130 L12 140 Z" style="fill:var(--latte)" filter="url(#rough)"/></svg>'+
    (bean?'<img class="bean-img" src="'+bean+'" alt="" width="210" height="177">':'')+
    '<span class="logo">GB5 LAB</span><span class="menu-title">'+titleHtml(d.title)+'</span></h1>'+
    (d.date?'<p class="updated">更新日期<time>'+esc(d.date)+'</time></p>':'')+'</header>';
  if(tabs.length)h+='<nav class="tabs" aria-label="菜單分類"><div class="tabs-inner wrap">'+tabs.map(function(t,i){return '<button type="button" class="tab" data-target="'+t[0]+'"'+(i===0?' aria-current="true"':'')+'>'+esc(t[1])+'</button>';}).join('')+'</div></nav>';
  h+='<main class="wrap">'+viewCoffee(d)+viewDrinks(d)+viewDesserts(d)+'</main>';
  h+='<footer class="foot"><div class="foot-row wrap">'+
    (ig?'<a class="ig" href="https://www.instagram.com/'+ig+'/" target="_blank" rel="noopener">Instagram<b>@'+esc(ig)+'</b></a>':'')+
    (d.wifi?'<div class="wifi">'+ICON.wifi+'<span>Wi‑Fi 密碼</span><code id="wifi-pw">'+esc(d.wifi)+'</code><button type="button" class="copy" data-act="copy-wifi">複製</button></div>':'')+
    '</div><div class="watermark" aria-hidden="true">GB5 LAB</div></footer>';
  if(mode==='view'&&canEdit)h+='<button type="button" class="fab" data-act="edit">'+ICON.pen+'編輯菜單</button>';
  if(mode==='preview')h+=barHtml();
  return h;
}

/* ---------- edit view ---------- */
function fid(path){return 'f-'+path.replace(/\./g,'-');}
function fld(label,path,value,o){
  o=o||{};
  return '<label class="fld'+(o.cls?' '+o.cls:'')+'" for="'+fid(path)+'"><span class="field-label">'+label+'</span>'+
    '<input type="text" id="'+fid(path)+'" data-path="'+path+'"'+(o.num?' data-num inputmode="numeric" pattern="[0-9]*"':'')+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+' value="'+esc(value==null?'':value)+'" autocomplete="off"></label>';
}
function tools(path,i,len,arm){
  return '<button type="button" class="btn icon" data-act="up" data-path="'+path+'" aria-label="上移"'+(i===0?' disabled':'')+'>'+ICON.up+'</button>'+
    '<button type="button" class="btn icon" data-act="down" data-path="'+path+'" aria-label="下移"'+(i===len-1?' disabled':'')+'>'+ICON.down+'</button>'+
    '<button type="button" class="btn danger" data-act="del" data-path="'+path+'"'+(arm?' data-arm':'')+'>'+ICON.del.replace('<svg','<svg width="15" height="15" style="fill:none;stroke:currentColor;stroke-width:2"')+'刪除</button>';
}
function edNo(i){return '<span class="ed-no">'+(i+1)+'.</span>';}
function edBean(b,i,d){
  var p='coffee.'+i, len=d.coffee.length;
  return '<li class="ed-item'+(b.pick?' is-pick':'')+'" data-item="'+p+'">'+edNo(i)+
    fld('品名',p+'.name',b.name,{ph:'例如 衣索比亞 谷吉 G1 水洗'})+
    fld('風味（用 \\ 分隔）',p+'.flavor',b.flavor,{ph:'柑橘\\焦糖\\紅茶'})+
    '<div class="ed-line">'+fld('處理法',p+'.process',b.process)+fld('售價',p+'.price',b.price,{num:true})+'</div>'+
    '<div class="ed-tools"><label class="chk"><input type="checkbox" id="'+fid(p+'.pick')+'" data-path="'+p+'.pick"'+(b.pick?' checked':'')+'>店長推薦</label>'+
    '<span class="spacer"></span>'+tools(p,i,len)+'</div></li>';
}
function edDrink(x,i,d){
  var p='drinks.'+i;
  return '<li class="ed-item" data-item="'+p+'">'+edNo(i)+'<div class="ed-line two">'+fld('中文名',p+'.name',x.name)+fld('英文名',p+'.en',x.en)+'</div>'+
    '<div class="ed-line two">'+fld('HOT 價格',p+'.hot',x.hot,{num:true})+fld('ICED 價格',p+'.iced',x.iced,{num:true})+'</div>'+
    '<div class="ed-tools"><span class="spacer"></span>'+tools(p,i,d.drinks.length)+'</div></li>';
}
function edDessert(x,i,d){
  var p='desserts.'+i, src=img(x.photo);
  return '<li class="ed-item" data-item="'+p+'">'+edNo(i)+'<div class="ed-photo">'+(src?'<img src="'+src+'" alt="">':'<div class="ph-empty">沒有照片</div>')+
    '<div class="ed-photo-btns"><button type="button" class="btn" data-act="photo" data-path="'+p+'">'+(src?'換照片':'加照片')+'</button>'+
    (src?'<button type="button" class="btn" data-act="rm-photo" data-path="'+p+'">移除照片</button>':'')+'</div></div>'+
    '<div class="ed-line">'+fld('名稱',p+'.name',x.name)+fld('售價',p+'.price',x.price,{num:true})+'</div>'+
    '<label class="fld" for="'+fid(p+'.desc')+'"><span class="field-label">說明（一行一句）</span><textarea id="'+fid(p+'.desc')+'" data-path="'+p+'.desc" data-lines rows="3">'+esc((x.desc||[]).join('\n'))+'</textarea></label>'+
    '<div class="ed-tools"><span class="spacer"></span>'+tools(p,i,d.desserts.length)+'</div></li>';
}
function barHtml(){
  return '<div class="ed-bar" role="region" aria-label="編輯工具列"><div class="ed-bar-inner">'+
    '<p class="ed-status'+(statusErr?' err':'')+'" role="status">'+esc(statusMsg)+'</p>'+
    (mode==='edit'?'<button type="button" class="btn" data-act="undo"'+(undo.length?'':' disabled')+'>復原</button><button type="button" class="btn" data-act="preview">預覽</button>':'<button type="button" class="btn" data-act="back">返回編輯</button>')+
    '<button type="button" class="btn" data-act="cancel">取消</button>'+
    '<button type="button" class="btn pub" data-act="publish"'+(busy?' disabled':'')+'>'+(busy?'發布中…':'發布更新')+'</button></div></div>';
}
function renderEdit(d){
  return '<div class="ed wrap"><h1 class="ed-title">編輯菜單</h1>'+
    '<p class="ed-help">改好後按「發布更新」，客人打開或重新整理網頁就會看到新的菜單。按「取消」會放棄這次所有修改。</p>'+
    '<h2>基本資料</h2><div class="ed-grid">'+fld('菜單標題','title',d.title)+
    '<div class="with-btn">'+fld('更新日期','date',d.date,{ph:'2026.10.31'})+'<button type="button" class="btn" data-act="today">今天</button></div>'+
    fld('Instagram 帳號','instagram',d.instagram,{ph:'gb5_lab'})+fld('Wi‑Fi 密碼','wifi',d.wifi)+'</div>'+
    '<label class="chk"><input type="checkbox" id="stamp-today"'+(stampToday?' checked':'')+'>發布時把更新日期改成今天</label>'+
    '<h2>1. 手沖咖啡</h2><p class="ed-note">編號會照順序自動排，用上下箭頭調整順序。勾「店長推薦」會在品名上方加紅色標籤。</p><ol class="ed-list">'+
    d.coffee.map(function(b,i){return edBean(b,i,d);}).join('')+'</ol>'+
    '<button type="button" class="btn add" data-act="add-bean">＋ 新增豆子</button>'+
    '<h2>2. 飲品</h2><p class="ed-note">價格留空代表不供應，客人那邊顯示「—」。</p><ol class="ed-list">'+d.drinks.map(function(x,i){return edDrink(x,i,d);}).join('')+'</ol>'+
    '<button type="button" class="btn add" data-act="add-drink">＋ 新增飲品</button>'+
    '<h2>3. 甜點</h2><ol class="ed-list">'+d.desserts.map(function(x,i){return edDessert(x,i,d);}).join('')+'</ol>'+
    '<button type="button" class="btn add" data-act="add-dessert">＋ 新增甜點</button>'+
    '<input type="file" id="photo-input" accept="image/*" hidden></div>'+barHtml();
}

/* ---------- render ---------- */
function render(){
  if(spyObserver){spyObserver.disconnect();spyObserver=null;}
  app.innerHTML=mode==='edit'?renderEdit(state):renderView(mode==='preview'?cleaned(state):saved);
  document.body.classList.toggle('has-fab',mode==='view'&&canEdit);
  document.body.classList.toggle('has-bar',mode==='preview');
  if(mode!=='edit')spy();
}
function refreshBar(){
  var bar=app.querySelector('.ed-bar');
  if(!bar)return;
  var t=document.createElement('div');t.innerHTML=barHtml();
  bar.replaceWith(t.firstChild);
}
function setStatus(msg,err){statusMsg=msg||'';statusErr=!!err;var s=app.querySelector('.ed-status');if(s){s.textContent=statusMsg;s.classList.toggle('err',statusErr);}}

function spy(){
  var tabs=[].slice.call(app.querySelectorAll('.tab'));
  if(!tabs.length||!('IntersectionObserver' in window))return;
  var vis={};
  spyObserver=new IntersectionObserver(function(es){
    es.forEach(function(e){vis[e.target.id]=e.isIntersecting;});
    var on=tabs.filter(function(t){return vis[t.dataset.target];})[0];
    if(!on)return;
    tabs.forEach(function(t){t.setAttribute('aria-current',t===on?'true':'false');});
    var bar=on.parentNode;
    if(bar.scrollWidth>bar.clientWidth)bar.scrollTo({left:Math.max(0,on.offsetLeft-24),behavior:'smooth'});
  },{rootMargin:'-90px 0px -55% 0px'});
  tabs.forEach(function(t){var s=document.getElementById(t.dataset.target);if(s)spyObserver.observe(s);});
}

/* ---------- state helpers ---------- */
function getAt(o,path){if(!path)return o;return path.split('.').reduce(function(a,k){return a==null?a:a[k];},o);}
function setAt(o,path,v){var ks=path.split('.'),last=ks.pop();var t=getAt(o,ks.join('.'));if(t!=null)t[last]=v;}
function parentOf(path){var ks=path.split('.');var i=+ks.pop();return {arr:getAt(state,ks.join('.')),i:i,base:ks.join('.')};}
function snapshot(){var s=JSON.stringify(state);undo.push(lastCommitted||s);if(undo.length>40)undo.shift();}
function commitText(){var s=JSON.stringify(state);if(s!==lastCommitted){undo.push(lastCommitted);if(undo.length>40)undo.shift();lastCommitted=s;saveDraft();refreshBar();}}
function structural(fn,focusSel){
  undo.push(JSON.stringify(state));if(undo.length>40)undo.shift();
  fn();
  lastCommitted=JSON.stringify(state);saveDraft();
  var y=window.scrollY;render();window.scrollTo(0,y);
  if(focusSel){var el=app.querySelector(focusSel);if(el){el.focus({preventScroll:true});el.scrollIntoView({block:'nearest'});}}
}
function cleaned(d){
  d=clone(d);
  function t(s){return String(s==null?'':s).trim();}
  d.title=t(d.title);d.date=t(d.date);d.instagram=igHandle(t(d.instagram));d.wifi=t(d.wifi);
  d.coffee=d.coffee.map(function(b){return {name:t(b.name),flavor:t(b.flavor),process:t(b.process),price:hasPrice(b.price)?b.price:null,pick:!!b.pick};}).filter(function(b){return b.name;});
  d.drinks=d.drinks.map(function(x){return {name:t(x.name),en:t(x.en),hot:hasPrice(x.hot)?x.hot:null,iced:hasPrice(x.iced)?x.iced:null};}).filter(function(x){return x.name;});
  d.desserts=d.desserts.map(function(x){return {name:t(x.name),price:hasPrice(x.price)?x.price:null,desc:(x.desc||[]).map(t).filter(Boolean),photo:img(x.photo)};}).filter(function(x){return x.name;});
  return d;
}
function saveDraft(){try{sessionStorage.setItem(DRAFT_KEY,JSON.stringify(state));}catch(e){}}
function readDraft(){try{var s=sessionStorage.getItem(DRAFT_KEY);return s?normalize(JSON.parse(s)):null;}catch(e){return null;}}
function clearDraft(){try{sessionStorage.removeItem(DRAFT_KEY);}catch(e){}}

/* ---------- self publish ---------- */
function resetCss(){
  var s=document.head&&document.head.querySelector('style');
  var txt=s&&!s.id&&s.textContent;
  return txt&&txt.indexOf('gb5')<0&&txt.length<4000?txt:FALLBACK_RESET;
}
function buildDocument(data){
  var style=document.getElementById('gb5-style').textContent;
  var script=document.getElementById('gb5-script').textContent;
  var json=JSON.stringify(data).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+resetCss()+'</style></head><body>'+
    PAGE_HEAD+'\n<style id="gb5-style">'+style+'</style>\n<div id="app"></div>\n<script type="application/json" id="gb5-data">'+json+'<\/script>\n<script id="gb5-script">'+script+'<\/script>\n</body></html>';
}
var READ_ONLY=['not_writer','not_granted','consent_required','not_declared','capability_disabled','capability_removed'];
function publish(retried){
  if(busy)return;
  if(!artifactNS){setStatus('這個畫面無法發布，請在 Claude 裡打開這個網頁再試。',true);return;}
  var data=cleaned(state);
  if(stampToday)data.date=today();
  if(JSON.stringify(data)===JSON.stringify(saved)){setStatus('內容跟目前的菜單一樣，不需要發布。');return;}
  try{sessionStorage.setItem(DRAFT_KEY,JSON.stringify(data));}catch(e){}
  busy=true;statusMsg='發布中…';statusErr=false;refreshBar();
  artifactNS.publish(buildDocument(data)).then(function(){
    setStatus('已發布，網頁重新載入中…');
  },function(err){
    busy=false;
    var code=err&&err.code;
    if(code==='upstream_error'&&!retried){setTimeout(function(){publish(true);},800+Math.random()*900);return;}
    if(code==='conflict')statusMsg='剛好有其他裝置更新了菜單，網頁會重新載入。你的修改已暫存，再按「編輯菜單」就能接著改。';
    else if(READ_ONLY.indexOf(code)>=0){statusMsg='這個畫面只能瀏覽，沒有發布權限。';canEdit=false;}
    else if(code==='too_large')statusMsg='照片太多或太大，網頁超過容量上限。請移除或換小一點的照片再發布。';
    else if(code==='rate_limited')statusMsg='發布太頻繁了，請等一分鐘再按一次。';
    else if(code==='invalid_content'||code==='transform_error')statusMsg='網頁內容格式有誤，這次沒有發布成功。';
    else statusMsg='連線出了問題，這次沒有發布成功，請再按一次「發布更新」。';
    statusErr=true;refreshBar();
  });
}

/* ---------- photos ---------- */
function loadPhoto(file){
  if(!file||!photoTarget)return;
  var target=photoTarget;photoTarget=null;
  var url=URL.createObjectURL(file);var im=new Image();
  im.onload=function(){
    var s=Math.min(im.naturalWidth,im.naturalHeight),N=360;
    var c=document.createElement('canvas');c.width=N;c.height=N;
    c.getContext('2d').drawImage(im,(im.naturalWidth-s)/2,(im.naturalHeight-s)/2,s,s,0,0,N,N);
    URL.revokeObjectURL(url);
    var data=c.toDataURL('image/jpeg',0.82);
    structural(function(){setAt(state,target+'.photo',data);});
    setStatus('照片已換好（裁成正方形），記得按「發布更新」。');
  };
  im.onerror=function(){URL.revokeObjectURL(url);setStatus('這個檔案讀不出來，請換 JPG 或 PNG 照片。',true);};
  im.src=url;
}

/* ---------- events ---------- */
function disarm(btn,label){setTimeout(function(){if(btn.isConnected&&btn.classList.contains('armed')){btn.classList.remove('armed');btn.innerHTML=label;}},4000);}
function confirmTwice(btn,text){
  if(btn.classList.contains('armed'))return true;
  var label=btn.innerHTML;btn.classList.add('armed');btn.textContent=text;disarm(btn,label);return false;
}
app.addEventListener('click',function(e){
  var tab=e.target.closest('.tab');
  if(tab){var s=document.getElementById(tab.dataset.target);if(s)s.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return;}
  var btn=e.target.closest('[data-act]');if(!btn)return;
  var act=btn.dataset.act,path=btn.dataset.path;
  if(act==='copy-wifi'){
    var code=app.querySelector('#wifi-pw');
    var done=function(t){btn.textContent=t;setTimeout(function(){btn.textContent='複製';},2000);};
    var sel=function(){var r=document.createRange();r.selectNodeContents(code);var g=getSelection();g.removeAllRanges();g.addRange(r);done('已選取');};
    try{navigator.clipboard.writeText(code.textContent).then(function(){done('已複製');},sel);}catch(err){sel();}
    return;
  }
  if(act==='edit'){
    var draft=readDraft();
    state=draft&&JSON.stringify(draft)!==JSON.stringify(saved)?draft:clone(saved);
    undo=[];lastCommitted=JSON.stringify(state);mode='edit';
    statusMsg=draft&&state===draft?'已載入上次還沒發布的修改。按「取消」可以放棄。':'';statusErr=false;
    render();window.scrollTo(0,0);return;
  }
  if(act==='preview'){mode='preview';render();window.scrollTo(0,0);return;}
  if(act==='back'){mode='edit';render();window.scrollTo(0,0);return;}
  if(act==='publish'){publish(false);return;}
  if(act==='undo'){if(undo.length){state=JSON.parse(undo.pop());lastCommitted=JSON.stringify(state);saveDraft();var y=window.scrollY;statusMsg='已復原上一步。';statusErr=false;render();window.scrollTo(0,y);}return;}
  if(act==='cancel'){
    var changed=JSON.stringify(cleaned(state))!==JSON.stringify(cleaned(saved));
    if(changed&&!confirmTwice(btn,'確定放棄修改？'))return;
    clearDraft();state=clone(saved);mode='view';statusMsg='';render();window.scrollTo(0,0);return;
  }
  if(act==='today'){var f=app.querySelector('#f-date');if(f){f.value=today();state.date=f.value;commitText();}return;}
  if(act==='add-bean'){structural(function(){state.coffee.push({name:'',flavor:'',process:'',price:null,pick:false});},'#'+fid('coffee.'+state.coffee.length+'.name'));return;}
  if(act==='add-drink'){structural(function(){state.drinks.push({name:'',en:'',hot:null,iced:null});},'#'+fid('drinks.'+state.drinks.length+'.name'));return;}
  if(act==='add-dessert'){structural(function(){state.desserts.push({name:'',price:null,desc:[],photo:''});},'#'+fid('desserts.'+state.desserts.length+'.name'));return;}
  if(act==='photo'){photoTarget=path;var inp=app.querySelector('#photo-input');if(inp){inp.value='';inp.click();}return;}
  if(act==='rm-photo'){structural(function(){setAt(state,path+'.photo','');});return;}
  if(act==='up'||act==='down'||act==='del'){
    var P=parentOf(path);if(!P.arr)return;
    if(act==='del'){
      if('arm' in btn.dataset&&!confirmTwice(btn,'連同豆子一起刪除？'))return;
      structural(function(){P.arr.splice(P.i,1);});
      setStatus('已刪除。按「復原」可以救回來。');return;
    }
    var j=act==='up'?P.i-1:P.i+1;if(j<0||j>=P.arr.length)return;
    structural(function(){var it=P.arr.splice(P.i,1)[0];P.arr.splice(j,0,it);},'[data-act="'+act+'"][data-path="'+P.base+'.'+j+'"]:not(:disabled), [data-act="'+(act==='up'?'down':'up')+'"][data-path="'+P.base+'.'+j+'"]');
    return;
  }
});
app.addEventListener('input',function(e){
  var el=e.target,path=el.dataset&&el.dataset.path;
  if(mode!=='edit'||!path||el.type==='checkbox')return;
  var v;
  if('num' in el.dataset){var t=el.value.replace(/[^\d]/g,'');if(t!==el.value)el.value=t;v=t===''?null:parseInt(t,10);}
  else if('lines' in el.dataset)v=el.value.split('\n');
  else v=el.value;
  setAt(state,path,v);
});
app.addEventListener('change',function(e){
  var el=e.target;if(mode!=='edit')return;
  if(el.id==='photo-input'){loadPhoto(el.files&&el.files[0]);return;}
  if(el.id==='stamp-today'){stampToday=el.checked;return;}
  if(el.dataset.path&&el.type==='checkbox'){setAt(state,el.dataset.path,el.checked);var li=el.closest('.ed-item');if(li)li.classList.toggle('is-pick',el.checked);commitText();return;}
  if(el.dataset.path)commitText();
});

/* ---------- start ---------- */
render();
(function(){var d=readDraft();if(d&&JSON.stringify(cleaned(d))===JSON.stringify(saved))clearDraft();})();
if(window.claude&&typeof window.claude.use==='function'){
  Promise.all([window.claude.use('user'),window.claude.use('artifact')]).then(function(res){
    var user=res[0];artifactNS=res[1];
    if(!user||!artifactNS)return false;
    return user.canEdit();
  }).then(function(ok){
    if(ok&&!canEdit){canEdit=true;if(mode==='view')render();}
  }).catch(function(){});
}
})();
</script>
